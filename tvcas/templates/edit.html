{% extends 'base.html' %}{% block content %}<p class="eyebrow">{{labels[kind]}}</p><h1>{{'Редакция' if row_id else 'Нов запис'}}</h1><section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="fields">{% if kind=='cards' and not row_id %}<label>Брой карти<input type="number" name="quantity" value="1" min="1" max="5000"><small>Последователни номера, отделен ключ за всяка карта</small></label>{% endif %}{% for field in fields %}<label>{{field_labels.get(field,field)}}{% if field=='info' %}<textarea name="{{field}}">{{row.get(field,'') if row.get(field) is not none else ''}}</textarea>{% elif field in ('start','finish') %}<input type="datetime-local" name="{{field}}" value="{{row.get(field,'')|utc_date(true)}}" step="1" required>{% elif field=='key' %}<input type="password" name="key" autocomplete="new-password" placeholder="Празно = {{'запазване' if row_id else 'автоматичен ключ'}}">{% elif field in ('pair','type','packet_mode','status') %}<select name="{{field}}">{% for value in ([1,2] if field=='type' else ([0] if field=='packet_mode' else [0,1])) %}<option value="{{value}}" {% if row.get(field,0)==value %}selected{% endif %}>{{value}}</option>{% endfor %}</select>{% else %}<input name="{{field}}" value="{{row.get(field,'') if row.get(field) is not none else ''}}" {% if field=='access_criteria' %}pattern="[0-9a-fA-F]{8}" maxlength="8"{% endif %}>{% endif %}{% if field in ('start','finish') %}<small>Дата и час UTC</small>{% elif field=='client_id' %}<small>Десетично число или 0x0B000001</small>{% elif field=='access_criteria' %}<small>32-битова маска, 8 HEX знака</small>{% elif field in ('delay_start','delay_stop','transition_delay_start','transition_delay_stop','repetition_period','max_compute_time','ac_delay_start','ac_delay_stop') %}<small>Милисекунди</small>{% elif field=='min_cp_duration' %}<small>Единици по 100 ms</small>{% endif %}</label>{% endfor %}</div><div class="actions"><button>Запази</button><a href="{{url_for('listing',kind=kind)}}">Отказ</a></div></form></section>{% if actor=='admin' and row_id %}<section class="panel danger"><h2>Премахване</h2><form method="post" action="{{url_for('delete',kind=kind,row_id=row_id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label><input type="checkbox" required> Потвърждавам изтриването на този запис.</label><button class="destructive">Изтрий</button></form></section>{% endif %}{% endblock %}
